<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; background: #000; overflow: hidden; }
#qr-reader { width: 100%; }
#msg { color: #ccc; font-size: 13px; padding: 12px; text-align: center; }
video { object-fit: cover !important; width: 100% !important; }
/* Hide rectangular dark shading panels */
#qr-reader__scan_region > img,
#qr-reader__scan_region__box_top,
#qr-reader__scan_region__box_bottom,
#qr-reader__scan_region__box_left,
#qr-reader__scan_region__box_right { display: none !important; }
/* Hide library UI chrome */
#qr-reader__dashboard,
#qr-reader__header_message,
#qr-reader__status_span { display: none !important; }
</style>
</head>
<body>
<div id="qr-reader"></div>
<div id="msg">Đang khởi động camera…</div>
<script>
var lastResult = "";
var cameraStarted = false;

function setFrameHeight(h) {
  window.parent.postMessage({ type: "streamlit:setFrameHeight", height: h }, "*");
}
function setComponentValue(v) {
  window.parent.postMessage({ type: "streamlit:setComponentValue", value: v, dataType: "json" }, "*");
}
function setComponentReady() {
  window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
}

function showMsg(text) {
  document.getElementById("msg").textContent = text;
}

function startCamera() {
  if (cameraStarted) return;
  cameraStarted = true;

  var w = window.innerWidth || 320;
  var sz = Math.round(w * 0.75);

  setFrameHeight(w + 16);

  var scanner = new Html5Qrcode("qr-reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: sz, height: sz } },
    function(text) {
      if (text !== lastResult) {
        if (navigator.vibrate) navigator.vibrate(200);
        lastResult = text;
        showMsg("Đã quét: " + text);
        setComponentValue(text);
      }
    }
  ).then(function() {
    showMsg("");
  }).catch(function(err) {
    cameraStarted = false;
    showMsg("Lỗi: " + err);
    setFrameHeight(80);
  });
}

// Set a visible height immediately so the iframe isn't collapsed
setFrameHeight(window.innerWidth || 320);

document.addEventListener("DOMContentLoaded", function() {
  setTimeout(startCamera, 200);
});

window.addEventListener("message", function(event) {
  if (event.data && event.data.type === "streamlit:render" && !cameraStarted) {
    setTimeout(startCamera, 200);
  }
});

setComponentReady();
</script>
</body>
</html>
